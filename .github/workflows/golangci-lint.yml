name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate
        run: go generate ./...

      - name: Check generated code
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: Test
        run: go test -race -v ./...

      - name: Build
        run: go build -v ./...
