name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify tag is semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 必须是 v<major>.<minor>.<patch>，可带 -prerelease 后缀，不使用 build metadata。
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::标签 $TAG 不符合 v<major>.<minor>.<patch> 语义化版本格式，拒绝发布。"
            exit 1
          fi
          echo "标签 $TAG 是合法的语义化版本"

      - name: Verify tag is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交不在 master 上，拒绝发布。"
            exit 1
          fi
          echo "标签 $GITHUB_REF_NAME 指向 master 上的提交 $GITHUB_SHA"

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 幂等：同名 Release 已存在时先删除再重建，便于失败后重跑。
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true

          # 带预发布后缀（如 v0.4.0-rc.1）的 tag 发布为 Pre-release，其余标记为 Latest。
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" --repo "$REPO" --generate-notes --prerelease
          else
            gh release create "$TAG" --repo "$REPO" --generate-notes --latest
          fi
