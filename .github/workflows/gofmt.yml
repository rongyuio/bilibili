name: GoFmt

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: gofmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt -s，请在本地执行 gofmt -s -w <文件> 后重新提交："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"
